name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            hyprland \
            pkg-config

      - name: Bug check (build with -Werror)
        run: make check

      - name: Build release artifact
        run: |
          echo "Building against Hyprland $(pkg-config --modversion hyprland)"
          make -j"$(nproc)"

      - name: Verify artifact
        run: |
          file libfocusZ.so
          test -s libfocusZ.so
          sha256sum libfocusZ.so > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            libfocusZ.so SHA256SUMS \
            --generate-notes
